name: Release

# Push a tag like v0.2.0 to build and publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            file: rusted-windows-x64.zip
          - os: ubuntu-latest
            file: rusted-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force pkg/data | Out-Null
          Copy-Item target/release/rusted.exe, deploy/start.bat, README.md, LICENSE, LICENSE-GPL, LICENSE-APACHE, NOTICE.md pkg/
          Copy-Item data/structures.nbt pkg/data/
          Compress-Archive -Path pkg/* -DestinationPath ${{ matrix.file }}
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p pkg/data
          cp target/release/rusted deploy/start.sh deploy/rusted.service README.md LICENSE LICENSE-GPL LICENSE-APACHE NOTICE.md pkg/
          cp data/structures.nbt pkg/data/
          chmod +x pkg/rusted pkg/start.sh
          tar -czf ${{ matrix.file }} -C pkg .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: ${{ matrix.file }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          # A full release, so GitHub shows it as the green "Latest" (the body still says alpha).
          name: Rusted ${{ github.ref_name }} · Bedrock 1.26.60
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            rusted-windows-x64.zip
            rusted-linux-x64.tar.gz
          body: |
            Alpha build of Rusted for Minecraft: Bedrock Edition **1.26.60**.

            **Windows:** unzip and double-click `start.bat`. A console opens where you can type commands like `help`, `op <name>` and `stop`.
            **Linux:** `tar -xzf rusted-linux-x64.tar.gz && ./start.sh`. To run it as a service, see the [hosting guide](https://rustedmc.github.io/Rusted/hosting.html).

            Then add a server in Minecraft with your machine's address, port `19132`.
            Docs: https://rustedmc.github.io/Rusted/ · Discord: https://discord.gg/HBegxHxREc

            This is an alpha: expect missing features and bugs. See [ROADMAP.md](https://github.com/RustedMC/Rusted/blob/main/ROADMAP.md).
